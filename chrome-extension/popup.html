<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AutoBody Board Sync</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      width: 380px;
      min-height: 200px;
      background: #f8fafc;
      color: #1e293b;
      font-size: 13px;
    }

    /* ── Header ── */
    .header {
      background: #1d4ed8;
      color: white;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .header-title {
      font-size: 14px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .header-user {
      font-size: 11px;
      color: #bfdbfe;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .btn-link {
      background: none;
      border: none;
      color: #93c5fd;
      cursor: pointer;
      font-size: 11px;
      text-decoration: underline;
    }
    .btn-link:hover { color: white; }

    /* ── Views ── */
    .view { padding: 16px; display: none; }
    .view.active { display: block; }

    /* ── Login ── */
    .login-title {
      text-align: center;
      font-size: 16px;
      font-weight: 700;
      color: #1d4ed8;
      margin-bottom: 16px;
    }
    .form-group { margin-bottom: 10px; }
    .form-group label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      color: #64748b;
      margin-bottom: 4px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .form-group input {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-size: 13px;
      outline: none;
    }
    .form-group input:focus { border-color: #3b82f6; box-shadow: 0 0 0 2px #bfdbfe; }

    /* ── Buttons ── */
    .btn {
      width: 100%;
      padding: 9px;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }
    .btn-primary { background: #2563eb; color: white; }
    .btn-primary:hover:not(:disabled) { background: #1d4ed8; }
    .btn-primary:disabled { background: #93c5fd; cursor: not-allowed; }
    .btn-success { background: #16a34a; color: white; margin-top: 10px; }
    .btn-success:hover:not(:disabled) { background: #15803d; }
    .btn-success:disabled { background: #86efac; cursor: not-allowed; }

    /* ── Alert ── */
    .alert {
      padding: 8px 10px;
      border-radius: 6px;
      font-size: 12px;
      margin-bottom: 10px;
    }
    .alert-error   { background: #fef2f2; border: 1px solid #fecaca; color: #dc2626; }
    .alert-success { background: #f0fdf4; border: 1px solid #bbf7d0; color: #15803d; }
    .alert-info    { background: #eff6ff; border: 1px solid #bfdbfe; color: #1d4ed8; }
    .alert-warn    { background: #fffbeb; border: 1px solid #fde68a; color: #92400e; }

    /* ── Main view ── */
    .page-check {
      padding: 10px;
      background: #fff;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      margin-bottom: 10px;
      font-size: 12px;
      color: #64748b;
    }
    .page-check .url { font-weight: 600; color: #334155; word-break: break-all; }
    .on-ccc  { color: #15803d; }
    .off-ccc { color: #dc2626; }

    /* ── RO list ── */
    .ro-list { max-height: 320px; overflow-y: auto; margin-bottom: 10px; }
    .ro-item {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      padding: 8px 10px;
      background: white;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      margin-bottom: 6px;
      cursor: pointer;
      transition: border-color 0.1s;
    }
    .ro-item:hover { border-color: #93c5fd; }
    .ro-item.selected { border-color: #3b82f6; background: #eff6ff; }
    .ro-item.exists   { opacity: 0.5; }
    .ro-item input[type=checkbox] { margin-top: 2px; cursor: pointer; }
    .ro-body { flex: 1; min-width: 0; }
    .ro-num  { font-weight: 700; color: #1d4ed8; font-size: 13px; }
    .ro-info { color: #475569; font-size: 11px; line-height: 1.5; }
    .ro-badge {
      font-size: 10px;
      font-weight: 600;
      padding: 1px 6px;
      border-radius: 10px;
      white-space: nowrap;
    }
    .badge-col   { background: #e0e7ff; color: #3730a3; }
    .badge-exist { background: #f1f5f9; color: #94a3b8; }

    /* ── Summary bar ── */
    .summary-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 2px;
      font-size: 11px;
      color: #64748b;
      margin-bottom: 6px;
    }
    .summary-bar a { color: #3b82f6; cursor: pointer; text-decoration: none; }
    .summary-bar a:hover { text-decoration: underline; }

    /* ── Sync result ── */
    .result-item {
      font-size: 11px;
      padding: 3px 0;
      border-bottom: 1px solid #f1f5f9;
      display: flex;
      gap: 6px;
      align-items: center;
    }
    .result-item .icon { font-size: 10px; }

    /* ── Loading spinner ── */
    .spinner {
      display: inline-block;
      width: 12px;
      height: 12px;
      border: 2px solid #bfdbfe;
      border-top-color: #2563eb;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
      vertical-align: middle;
      margin-right: 4px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .select-all-row {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 4px 2px;
      font-size: 11px;
      color: #64748b;
      margin-bottom: 4px;
    }

    /* ── DingTalk section ── */
    .section-divider {
      border: none;
      border-top: 1px solid #e2e8f0;
      margin: 12px 0;
    }
    .section-label {
      font-size: 10px;
      font-weight: 700;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
    }
    .btn-dingtalk {
      width: 100%;
      padding: 9px;
      border: 1.5px solid #e0e7ff;
      border-radius: 8px;
      background: #eef2ff;
      color: #4338ca;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
    }
    .btn-dingtalk:hover:not(:disabled) { background: #e0e7ff; border-color: #818cf8; }
    .btn-dingtalk:disabled { opacity: 0.5; cursor: not-allowed; }
    .dt-success {
      background: #f0fdf4;
      border: 1px solid #bbf7d0;
      border-radius: 8px;
      padding: 10px 12px;
      margin-top: 8px;
      font-size: 12px;
      color: #15803d;
    }
    .app-url-row {
      display: flex;
      gap: 6px;
      align-items: center;
      margin-top: 10px;
    }
    .app-url-row input {
      flex: 1;
      padding: 5px 8px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-size: 11px;
      color: #334155;
    }
    .app-url-row button {
      padding: 5px 10px;
      background: #e2e8f0;
      border: none;
      border-radius: 6px;
      font-size: 11px;
      cursor: pointer;
      color: #475569;
      font-weight: 600;
    }
    .app-url-row button:hover { background: #cbd5e1; }

    /* ── Auto-sync status ── */
    .auto-sync-box {
      background: #fff;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 10px 12px;
      margin-bottom: 10px;
      font-size: 11px;
    }
    .auto-sync-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 6px;
    }
    .auto-sync-label {
      font-weight: 700;
      color: #334155;
      font-size: 12px;
    }
    .btn-auto-sync {
      padding: 4px 10px;
      background: #f1f5f9;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      color: #334155;
    }
    .btn-auto-sync:hover:not(:disabled) { background: #e2e8f0; }
    .btn-auto-sync:disabled { opacity: 0.5; cursor: not-allowed; }
    .auto-sync-meta { color: #94a3b8; margin-bottom: 4px; }
    .auto-sync-steps { color: #475569; }
    .auto-sync-error { color: #dc2626; }
  </style>
</head>
<body>

  <!-- Header (always visible) -->
  <div class="header">
    <div class="header-title">🔧 AutoBody Board</div>
    <div class="header-user" id="header-user" style="display:none">
      <span id="header-name"></span>
      <button class="btn-link" id="logout-btn">Sign Out</button>
    </div>
  </div>

  <!-- LOGIN VIEW -->
  <div class="view active" id="view-login">
    <div class="login-title" style="margin-bottom:4px">Sign In</div>
    <p style="text-align:center;color:#64748b;font-size:11px;margin-bottom:14px">Use your AutoBody Board credentials</p>
    <div id="login-error" class="alert alert-error" style="display:none"></div>
    <div class="form-group">
      <label>Email</label>
      <input type="email" id="login-email" placeholder="you@shop.com" autocomplete="email"/>
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" id="login-password" placeholder="••••••••" autocomplete="current-password"/>
    </div>
    <button class="btn btn-primary" id="login-btn">Sign In</button>
  </div>

  <!-- MAIN VIEW -->
  <div class="view" id="view-main">
    <div id="page-status" class="page-check">
      Checking page…
    </div>

    <div id="main-msg" style="display:none"></div>

    <!-- Scan button -->
    <button class="btn btn-primary" id="scan-btn">🔍 Scan CCC Board</button>

    <!-- Results area (hidden until scanned) -->
    <div id="results-area" style="display:none; margin-top:12px;">
      <div class="summary-bar">
        <span id="found-count"></span>
        <span>
          <a id="sel-all-link">Select all</a> ·
          <a id="desel-all-link">Deselect all</a>
        </span>
      </div>
      <div class="ro-list" id="ro-list"></div>
      <button class="btn btn-success" id="sync-btn" disabled>⬆ Sync Selected to Board</button>
    </div>

    <!-- Sync results -->
    <div id="sync-results" style="display:none; margin-top:12px;"></div>

    <hr class="section-divider"/>

    <!-- Auto-sync status -->
    <div class="auto-sync-box" id="auto-sync-box">
      <div class="auto-sync-header">
        <span class="auto-sync-label">⏰ 每日自动同步 (8:00 AM)</span>
        <button class="btn-auto-sync" id="manual-sync-btn">▶ 立即运行</button>
      </div>
      <div class="auto-sync-meta" id="auto-sync-next">计算下次运行时间…</div>
      <div id="auto-sync-last"></div>
    </div>

    <hr class="section-divider"/>

    <!-- DingTalk section -->
    <div class="section-label">📋 Morning Meeting (DingTalk)</div>
    <div id="dt-status" style="font-size:11px;color:#94a3b8;margin-bottom:8px;">
      Navigate to a DingTalk AI summary page to import meeting notes.
    </div>
    <button class="btn-dingtalk" id="dt-btn" disabled>
      📋 Import Meeting Notes from DingTalk
    </button>
    <div id="dt-result" style="display:none"></div>

    <!-- App URL config -->
    <div class="app-url-row">
      <input type="text" id="app-url" placeholder="http://localhost:5173" title="Your AutoBody Board URL"/>
      <button id="save-url-btn">Save URL</button>
    </div>
    <div id="url-saved" style="display:none;font-size:10px;color:#16a34a;margin-top:3px;">✓ URL saved</div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
